name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      # electron-updater asks for "<channel>.yml", so a machine on the Beta
      # channel fetches beta.yml and finds nothing unless one exists. Despite
      # generateUpdatesFilesForAllChannels, the build emits latest.yml only, so
      # publish the same manifest under the beta name for prerelease tags. The
      # contents are channel-agnostic - version, files, hashes - the filename is
      # the whole mechanism.
      #
      # Stable machines are unaffected either way: they resolve through GitHub's
      # "latest release", which excludes prereleases.
      - name: Publish beta channel manifest
        if: contains(github.ref_name, '-beta')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # --clobber so a re-run does not fail on the file left by the first.
          gh release download "${{ github.ref_name }}" -p latest.yml -D . --clobber
          cp latest.yml beta.yml
          gh release upload "${{ github.ref_name }}" beta.yml --clobber